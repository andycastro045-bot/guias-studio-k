<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guías Studio K</title>
<meta name="description" content="Crea guías de envío 4×6 de Studio K y descárgalas en PDF listas para imprimir.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guías Studio K">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column; home = logo + one button, editor = the 4x6 label itself, filled in place */
:root {
  --bg: #f3f2ef;
  --paper: #ffffff;
  --ink: #111111;
  --muted: #6b6862;
  --line: #d9d6d0;
  --accent: #111111;
  --accent-ink: #ffffff;
  --ok: #2f6b3a;
  --warn: #9a3b2c;
  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --paper: #ffffff; --ink: #f1efea; --muted: #a29e96; --line: #34312e;
    --accent: #f1efea; --accent-ink: #111111; --ok: #7fbf8a; --warn: #e08b7a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}
img { max-width: 100%; }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Home */
.home { display: flex; flex-direction: column; align-items: center; gap: 22px; padding-top: 24px; text-align: center; }
.brand { width: 220px; max-width: 70%; background: #fff; border-radius: 14px; padding: 18px 20px; }
.brand img { display: block; width: 100%; }
.home h1 { font-family: var(--display); font-weight: 600; font-size: 34px; margin: 0; text-wrap: balance; }
.home p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.5; }
.btn {
  font: 600 16px/1 var(--body); border: 0; border-radius: 999px; cursor: pointer;
  padding: 16px 26px; background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:hover { opacity: .88; }
.btn:focus-visible, .ghost:focus-visible, .field:focus-visible { outline: 3px solid #6aa0ff; outline-offset: 2px; }
.btn.big { font-size: 18px; padding: 20px 34px; }
.ghost {
  font: 500 14px/1 var(--body); background: transparent; color: var(--ink); cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px;
}
.meta { font-size: 13px; color: var(--muted); }

/* Saved guides, newest first */
.guides { display: flex; flex-direction: column; gap: 10px; }
.guides h3 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 8px 0 0; }
.guides ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.guides li { border-bottom: 1px solid var(--line); }
.guide-row {
  width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline;
  background: transparent; border: 0; color: var(--ink); text-align: left; cursor: pointer;
  padding: 12px 4px; font: inherit;
}
.guide-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.guide-row:focus-visible { outline: 3px solid #6aa0ff; outline-offset: -3px; }
.g-num { font-weight: 600; font-variant-numeric: tabular-nums; grid-row: span 2; }
.g-when { font-size: 14px; font-variant-numeric: tabular-nums; }
.g-who { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Editor toolbar */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.bar h2 { font-family: var(--display); font-size: 26px; font-weight: 600; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.status { font-size: 13px; min-height: 1.2em; color: var(--muted); text-align: center; margin: 0; }
.status.ok { color: var(--ok); }
.status.err { color: var(--warn); }

/* The 4x6 label: 288 x 432 pt, 1pt = var(--u) */
.label-shell { container-type: inline-size; width: 100%; max-width: 432px; margin: 0 auto; }
.label {
  --u: calc(100cqw / 288);
  position: relative; width: 100%; aspect-ratio: 288 / 432; max-width: 100%;
  background: var(--paper); color: #000; border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.10);
  overflow: hidden;
}
.label .logo { position: absolute; left: calc(64 * var(--u)); top: calc(12 * var(--u)); width: calc(160 * var(--u)); }
.label .rule { position: absolute; left: calc(14 * var(--u)); width: calc(260 * var(--u)); top: calc(118.4 * var(--u)); height: calc(1.2 * var(--u)); background: #000; }
.box {
  position: absolute; left: calc(14 * var(--u)); width: calc(260 * var(--u));
  border: calc(1.3 * var(--u)) solid #000; border-radius: calc(4 * var(--u));
  display: flex; flex-direction: column;
}
.box label {
  font: 700 calc(7.6 * var(--u))/1 Helvetica, Arial, sans-serif; color: #000;
  padding: calc(5.5 * var(--u)) 0 0 calc(6 * var(--u)); letter-spacing: .01em;
}
.field {
  flex: 1; width: 100%; border: 0; background: transparent; color: #000; resize: none;
  font: 400 calc(11 * var(--u))/1.2 Helvetica, Arial, sans-serif;
  padding: calc(3 * var(--u)) calc(6 * var(--u)) calc(3 * var(--u)); border-radius: calc(3 * var(--u));
}
.field::placeholder { color: #b9b6b0; }
.field:hover { background: #f6f5f2; }
.box.missing { border-color: #b4412f; }
.thanks-rule { position: absolute; left: calc(54 * var(--u)); width: calc(180 * var(--u)); top: calc(385.5 * var(--u)); height: calc(.9 * var(--u)); background: #000; }
.thanks {
  position: absolute; left: 0; right: 0; top: calc(395 * var(--u)); text-align: center;
  font: italic 700 calc(14 * var(--u))/1 "Times New Roman", Times, "Liberation Serif", serif; color: #000;
}
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .label { animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="home" id="home">
    <div class="brand"><img src="logo.svg" alt="Studio K, Tu molde Perfecto"></div>
    <h1>Guías de envío</h1>
    <p>Crea la guía 4×6 de cada pedido. Solo llenas los datos del cliente y la imprimes o descargas en PDF.</p>
    <button class="btn big" id="newBtn" type="button">＋ Crear nueva guía</button>
    <button class="ghost" id="installBtn" type="button" hidden>Instalar app en este dispositivo</button>
  </section>

  <section class="guides" id="guidesSection" hidden>
    <h3>Guías creadas</h3>
    <ul id="guidesList"></ul>
  </section>

  <section id="editor" hidden>
    <div class="wrap">
      <div class="bar">
        <div>
          <h2 id="editorTitle">Nueva guía</h2>
          <span class="meta" id="editorWhen"></span>
        </div>
        <button class="ghost" id="backBtn" type="button">← Inicio</button>
      </div>

      <form id="form" autocomplete="off">
        <div class="label-shell">
          <div class="label" id="label">
            <img class="logo" src="logo.svg" alt="Studio K">
            <div class="rule"></div>
            <div class="box" style="top:calc(129.2 * var(--u)); height:calc(37.8 * var(--u))">
              <label for="f-nombre">NOMBRES COMPLETOS</label>
              <input class="field" id="f-nombre" name="nombre" placeholder="Nombre y apellido">
            </div>
            <div class="box" style="top:calc(173.9 * var(--u)); height:calc(37.8 * var(--u))">
              <label for="f-cedula">CÉDULA DE IDENTIDAD</label>
              <input class="field" id="f-cedula" name="cedula" inputmode="numeric" placeholder="0000000000">
            </div>
            <div class="box" style="top:calc(218.6 * var(--u)); height:calc(37.8 * var(--u))">
              <label for="f-celular">NÚMERO CELULAR</label>
              <input class="field" id="f-celular" name="celular" inputmode="tel" placeholder="09XXXXXXXX">
            </div>
            <div class="box" style="top:calc(264 * var(--u)); height:calc(37.8 * var(--u))">
              <label for="f-ciudad">CIUDAD</label>
              <input class="field" id="f-ciudad" name="ciudad" placeholder="Ciudad / provincia">
            </div>
            <div class="box" style="top:calc(308.8 * var(--u)); height:calc(66.2 * var(--u))">
              <label for="f-direccion">DIRECCIÓN DE ENVÍO</label>
              <textarea class="field" id="f-direccion" name="direccion" placeholder="Calle principal, secundaria, número, referencia"></textarea>
            </div>
            <div class="thanks-rule"></div>
            <div class="thanks">¡Gracias por tu compra!</div>
          </div>
        </div>
      </form>

      <div class="actions">
        <button class="btn" id="printBtn" type="button">Imprimir</button>
        <button class="btn" id="pdfBtn" type="button">Descargar PDF</button>
        <button class="btn" id="shareBtn" type="button" hidden>Compartir</button>
      </div>
      <div class="actions">
        <button class="ghost" id="clearBtn" type="button">Limpiar y crear otra</button>
      </div>
      <p class="status" id="status"></p>
      <p class="hint">Escribe directamente sobre la guía. El PDF sale en tamaño 4×6 pulgadas, igual a tu formato.</p>
    </div>
  </section>
</div>

<iframe id="printFrame" title="Impresión" style="position:fixed;width:0;height:0;border:0;right:0;bottom:0" aria-hidden="true"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
